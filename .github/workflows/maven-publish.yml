name: Java CI with Maven

# 1. TRIGGER: Eseguiamo i controlli su ogni Push e ogni Pull Request sul main
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 2. CHECKOUT: Scarica il codice nel server di GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 3. SETUP JAVA: Configura il JDK (Java 21 come nel tuo caso)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # La cache velocizza le build successive ricordando le dipendenze scaricate
        cache: maven

    # 4. BUILD & TEST: Il cuore della CI
    # -B: Batch mode (output pulito)
    # verify: Esegue i test e controlla che tutto sia a posto
    - name: Build and Test with Maven
      run: mvn -B verify

    # 5. ARTIFACT: Se la build passa, salva il file .jar così puoi scaricarlo
    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar
        retention-days: 5 # Elimina i file vecchi dopo 5 giorni per non sprecare spazio

    # 6. REPORT: Se i test falliscono, carica i report per capire cosa è successo
    - name: Upload Test Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/
